<meta name="robots" content="noindex, nofollow">
<meta http-equiv="refresh" content="0; url=de/index.html">
<script>
(function () {
  try {
    var map = { 'de': 'de/index.html', 'en': 'en/index.html', 'sr': 'sr/index.html', 'hr': 'hr/index.html' };
    var langs = navigator.languages || [navigator.language || ''];
    for (var i = 0; i < langs.length; i++) {
      var code = (langs[i] || '').slice(0, 2).toLowerCase();
      if (map[code]) {
        window.location.replace(map[code]);
        return;
      }
    }
    window.location.replace('de/index.html');
  } catch (e) {
    window.location.replace('de/index.html');
  }
})();
</script>

</style>
</head>
